name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (macOS)
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Check release dispatch and publication safeguards
        run: python3 -m unittest discover -s tests -v

      - name: Build Release
        run: |
          xcodebuild build \
            -project AgentQuota.xcodeproj \
            -scheme AgentQuota \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/AgentQuotaDerivedData" \
            -quiet

      - name: Run tests
        run: |
          xcodebuild test \
            -project AgentQuota.xcodeproj \
            -scheme AgentQuota \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/AgentQuotaDerivedData" \
            -quiet
