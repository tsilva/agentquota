name: Release AgentQuota

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full commit SHA on main to build
        required: true
        type: string
      publish:
        description: Publish the automatically selected release after validation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agentquota-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RELEASE_SHA: ${{ inputs.ref }}
      RELEASE_PUBLISH: ${{ inputs.publish }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.build.outputs.version }}
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - name: Check out exact release source and full version history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Select version, test, build and validate DMG
        id: build
        run: .agents/skills/build-release/scripts/build-release-ci.zsh "$RUNNER_TEMP/agentquota-release-artifacts"

      - name: Preserve validated DMG and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentquota-${{ inputs.ref }}
          path: ${{ runner.temp }}/agentquota-release-artifacts/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_SHA: ${{ inputs.ref }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Download the validated candidate without rebuilding
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agentquota-${{ inputs.ref }}
          path: dist

      - name: Verify candidate identity and unused release state
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          [[ "$RELEASE_TAG" == "v$RELEASE_VERSION" ]] || exit 1
          [[ "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')" == "$RELEASE_SHA" ]] || exit 1
          tags="$(gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" --jq '.[].ref')"
          if grep -Fxq "refs/tags/$RELEASE_TAG" <<< "$tags"; then
            echo "Release tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          releases="$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name')"
          if grep -Fxq "$RELEASE_TAG" <<< "$releases"; then
            echo "GitHub Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          cd dist
          artifact="AgentQuota-$RELEASE_VERSION-macOS-arm64.dmg"
          [[ "$(find . -type f | wc -l)" -eq 2 ]] || exit 1
          [[ -f "$artifact" && -f "$artifact.sha256" ]] || exit 1
          [[ "$(wc -l < "$artifact.sha256")" -eq 1 ]] || exit 1
          checksum="$(cat "$artifact.sha256")"
          [[ "$checksum" == "$(sha256sum "$artifact")" ]] || exit 1
          sha256sum --check "$artifact.sha256"

      - name: Publish GitHub Release and exact validated assets
        shell: bash
        run: |
          set -euo pipefail
          artifact="AgentQuota-$RELEASE_VERSION-macOS-arm64.dmg"
          notice=$'Developer build for Apple silicon Macs running macOS 26. Open the DMG and drag AgentQuota to Applications. This app is ad-hoc signed and not notarized, so macOS may require opening it via right-click > Open or allowing it in System Settings > Privacy & Security.\n\nInstall the Codex CLI and run `codex login` before launching AgentQuota.'
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" -f sha="$RELEASE_SHA"
          [[ "$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" == "$RELEASE_SHA" ]] || exit 1
          gh release create "$RELEASE_TAG" "dist/$artifact" "dist/$artifact.sha256" \
            --verify-tag --target "$RELEASE_SHA" --title "AgentQuota $RELEASE_VERSION" \
            --generate-notes --notes "$notice" --fail-on-no-commits --latest

      - name: Verify published tag and fresh release downloads
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" == "$RELEASE_SHA" ]] || exit 1
          artifact="AgentQuota-$RELEASE_VERSION-macOS-arm64.dmg"
          gh release view "$RELEASE_TAG" --json url,isDraft,assets
          gh release download "$RELEASE_TAG" --dir published \
            --pattern "$artifact" --pattern "$artifact.sha256"
          cmp "dist/$artifact.sha256" "published/$artifact.sha256"
          cd published
          sha256sum --check "$artifact.sha256"
